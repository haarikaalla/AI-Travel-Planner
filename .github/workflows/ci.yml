name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: ruff check
        run: ruff check .

  test:
    name: Test · Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Compile all modules
        run: python -m compileall -q app.py travel_graph.py pdf_export.py travel_planner

      - name: Unit tests (no network, no LLM)
        run: pytest -m "not integration" --cov=travel_planner --cov-report=term-missing

      - name: Smoke-test the public API
        run: |
          python - <<'PY'
          from travel_graph import build_graph, parse_json, _fb_itinerary, _fb_budget
          from pdf_export import generate_pdf, generate_markdown, generate_text, generate_ics

          assert build_graph() is not None
          assert parse_json('```json\n{"ok": true}\n```') == {"ok": True}

          legacy = {
              "destination": "Paris", "duration": 3, "budget": "Mid-range ($1000-3000)",
              "travelers": 2, "interests": ["Culture"], "travel_style": "Balanced",
              "special_requests": "None",
          }
          assert len(_fb_itinerary(legacy)) == 3
          assert "total_per_person" in _fb_budget(legacy)["per_person_breakdown"]
          assert generate_pdf({"itinerary": _fb_itinerary(legacy)}).startswith(b"%PDF")
          assert generate_markdown({}) and generate_text({})
          assert "BEGIN:VCALENDAR" in generate_ics({})
          print("public API smoke test passed")
          PY

  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
